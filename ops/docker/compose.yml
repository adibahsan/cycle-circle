name: vesta

services:
  app:
    build:
      context: ../..
      dockerfile: ops/docker/app/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../..:/workspace
      - /workspace/apps/web/node_modules
      - /workspace/apps/web/.next
    environment:
      DATABASE_URL: postgresql://vesta_user:vesta_dev@postgres:5432/vesta_dev
      REDIS_URL: redis://redis:6379
      BDAPPS_APP_ID: APP_SIMULATOR
      BDAPPS_PASSWORD: simulator_password
      BDAPPS_BASE_URL: http://bdapps-simulator:7000
      BDAPPS_SIMULATOR_BASE_URL: http://bdapps-simulator:7000
      BDAPPS_SIMULATOR_UI_URL: http://localhost:10001/mchoice-tap-sdk
      JWT_SECRET: local-dev-jwt-secret-minimum-32-characters-long
      CRON_SECRET: local-cron-secret-min-16
      NODE_ENV: development
      MAILPIT_SMTP_URL: smtp://mailpit:1025
      ENABLE_BDAPPS_SIMULATOR_CHECKER: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.10-alpine
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: vesta_user
      POSTGRES_PASSWORD: vesta_dev
      POSTGRES_DB: vesta_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesta_user -d vesta_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.9-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: ops/docker/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://vesta_user:vesta_dev@postgres:5432/vesta_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      CRON_SECRET: local-cron-secret-min-16
      WORKER_TARGET_URL: http://app:3000
      REMINDERS_CRON: "*/5 * * * *"
      CAAS_CRON: "*/5 * * * *"
      RUN_ON_BOOT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.30.1
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

  bdapps-simulator:
    build:
      context: ../..
      dockerfile: ops/simulator/bdapps/Dockerfile
    platform: linux/amd64
    ports:
      - "10001:10001"
      - "7002:7000"
    environment:
      TAP_REST_PORT: "7000"
      TAP_UI_PORT: "10001"
    networks:
      default:
      edge:
        # Fixed so the web app can allowlist it via BDAPPS_WEBHOOK_IPS (just edge-wa).
        ipv4_address: 172.31.250.10
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10001/mchoice-tap-sdk"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Zero-dependency BDApps mock incl. /subscription/* (see ops/mock/bdapps/README.md).
  bdapps-mock:
    image: node:24-alpine
    command: node /mock/server.mjs
    ports:
      - "7003:7003"
    volumes:
      - ../mock/bdapps:/mock:ro
    environment:
      PORT: "7003"
      BDAPPS_APP_ID: APP_SIMULATOR
      BDAPPS_PASSWORD: simulator_password
      WEBHOOK_URL: http://host.docker.internal:3000/api/webhooks/subscription/notify
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # Local stand-in for the prod VM reverse proxy (just edge-up). Proxies to the
  # host dev servers; see ops/docker/nginx/edge.conf.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/edge.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      edge:
        ipv4_address: 172.31.250.2
        # Lets the simulator call back to http://cycle-circle.localhost/... like BDApps would.
        aliases:
          - cycle-circle.localhost
          - admin.cycle-circle.localhost
    restart: unless-stopped

networks:
  edge:
    ipam:
      config:
        - subnet: 172.31.250.0/24

volumes:
  postgres_data:
  redis_data:
  redisinsight_data:
