# Local stand-in for the production VM's reverse proxy.
#   cycle-circle.localhost        → web   (host :3000)
#   admin.cycle-circle.localhost  → admin (host :3001)
# X-Real-IP / X-Forwarded-For are OVERWRITTEN with the TCP peer address, never
# passed through from the client: validateWebhookSource() trusts x-real-ip for
# the BDAPPS_WEBHOOK_IPS allowlist, so a pass-through would make it spoofable.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vesta_web   { server host.docker.internal:3000; }
upstream vesta_admin { server host.docker.internal:3001; }

server {
    listen 80;
    server_name cycle-circle.localhost www.cycle-circle.localhost;

    location / {
        proxy_pass http://vesta_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name admin.cycle-circle.localhost;

    location / {
        proxy_pass http://vesta_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

# Unknown Host → reject, like a VM should.
server {
    listen 80 default_server;
    return 444;
}
