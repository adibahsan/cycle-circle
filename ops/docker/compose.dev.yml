  postgres:
    image: postgres:16-alpine
    ports:
      - "5431:5432"
    environment:
      POSTGRES_USER: vesta
      POSTGRES_PASSWORD: vesta_dev
      POSTGRES_DB: vesta_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vesta -d vesta_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: ops/docker/worker/Dockerfile
    environment:
      DATABASE_URL: postgresql://vesta:vesta_dev@postgres:5432/vesta_dev
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

  bdapps-simulator:
    build:
      context: ../..
      dockerfile: ops/simulator/bdapps/Dockerfile
    platform: linux/amd64
    ports:
      - "10001:10001"
      - "7002:7000"
    environment:
      TAP_REST_PORT: "7000"
      TAP_UI_PORT: "10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10001/mchoice-tap-sdk"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  postgres_data:
  redis_data:
