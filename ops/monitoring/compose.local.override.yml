# Local dev overlay — 7-day retention, Grafana on localhost:3030.

services:
  prometheus:
    environment:
      PROMETHEUS_RETENTION: 7d

  grafana:
    ports:
      - '3030:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-vesta_dev_grafana}
      GF_SERVER_ROOT_URL: http://localhost:3030

  postgres-exporter:
    environment:
      DATA_SOURCE_NAME: postgresql://vesta_user:vesta_dev@postgres:5432/vesta_dev?sslmode=disable
