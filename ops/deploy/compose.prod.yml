# Production stack — run from repo root or /opt/vesta with:
#   docker compose -f ops/deploy/compose.prod.yml …
# Env files live on the host at /opt/vesta/.env.*.production (see env/*.example).
# Optional ops/deploy/.env: NGINX_CONF, NEXT_PUBLIC_DEV_MODE build override.
# On VPS, pass monitoring secrets for Compose interpolation:
#   docker compose --env-file /opt/vesta/.env.monitoring.production -f ops/deploy/compose.prod.yml …

include:
  - path: ../monitoring/compose.yml
  - path: ../monitoring/compose.prod.override.yml

name: vesta

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/${NGINX_CONF:-cycle-circle.bootstrap.conf}:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web
      - admin
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    restart: "no"

  web:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_DEV_MODE: ${NEXT_PUBLIC_DEV_MODE:-false}
        NEXT_PUBLIC_USE_DUMMY_DATA: ${NEXT_PUBLIC_USE_DUMMY_DATA:-false}
    env_file: ${VESTA_WEB_ENV_FILE:-/opt/vesta/.env.web.production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: ../..
      dockerfile: ops/deploy/Dockerfile.admin
    env_file: ${VESTA_ADMIN_ENV_FILE:-/opt/vesta/.env.admin.production}
    environment:
      PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17.10-alpine
    env_file: ${VESTA_POSTGRES_ENV_FILE:-/opt/vesta/.env.postgres.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4.9-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  certbot_www:
  certbot_conf:
