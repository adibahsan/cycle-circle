# Production TLS config — requires certs at /etc/letsencrypt/live/cycle-circle.com/
# X-Real-IP / X-Forwarded-For are OVERWRITTEN with $remote_addr (never pass client headers).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vesta_web      { server web:3000; }
upstream vesta_admin    { server admin:3001; }
upstream vesta_grafana  { server grafana:3000; }

server {
    listen 80;
    server_name cycle-circle.com www.cycle-circle.com admin.cycle-circle.com monitoring.cycle-circle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.cycle-circle.com;
    ssl_certificate     /etc/letsencrypt/live/cycle-circle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cycle-circle.com/privkey.pem;
    return 301 https://cycle-circle.com$request_uri;
}

server {
    listen 443 ssl;
    server_name cycle-circle.com;
    ssl_certificate     /etc/letsencrypt/live/cycle-circle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cycle-circle.com/privkey.pem;

    location / {
        proxy_pass http://vesta_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name admin.cycle-circle.com;
    ssl_certificate     /etc/letsencrypt/live/cycle-circle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cycle-circle.com/privkey.pem;

    # Article image uploads (5 MB cap in the app + multipart overhead).
    client_max_body_size 6m;

    location / {
        proxy_pass http://vesta_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 443 ssl;
    server_name monitoring.cycle-circle.com;
    ssl_certificate     /etc/letsencrypt/live/cycle-circle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cycle-circle.com/privkey.pem;

    location / {
        proxy_pass http://vesta_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name nginx;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    return 444;
}

server {
    listen 443 ssl default_server;
    ssl_certificate     /etc/letsencrypt/live/cycle-circle.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cycle-circle.com/privkey.pem;
    return 444;
}
