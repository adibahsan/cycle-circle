# Pre-TLS bootstrap: HTTP only (no redirect to HTTPS).
# Lets Encrypt HTTP-01 + smoke tests before certs exist.
# After certbot, set NGINX_CONF=cycle-circle.conf in ops/deploy/.env and recreate nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vesta_web   { server web:3000; }
upstream vesta_admin { server admin:3001; }

server {
    listen 80;
    server_name cycle-circle.com www.cycle-circle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vesta_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name admin.cycle-circle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://vesta_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80 default_server;
    return 444;
}
