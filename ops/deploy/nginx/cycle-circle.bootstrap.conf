# Pre-TLS bootstrap: HTTP only (no redirect to HTTPS).
# Lets Encrypt HTTP-01 + smoke tests before certs exist.
# After certbot, set NGINX_CONF=cycle-circle.conf in ops/deploy/.env and recreate nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream vesta_web      { server web:3000; }
upstream vesta_admin    { server admin:3001; }
upstream vesta_grafana  { server grafana:3000; }

server {
    listen 80;
    server_name cycle-circle.com www.cycle-circle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        proxy_pass http://vesta_web;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name admin.cycle-circle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        proxy_pass http://vesta_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name monitoring.cycle-circle.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        proxy_pass http://vesta_grafana;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
    }
}

server {
    listen 80;
    server_name nginx;

    location /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}

server {
    listen 80 default_server;
    return 444;
}
