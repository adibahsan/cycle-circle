services:
  bdapps-simulator:
    build:
      context: ../..
      dockerfile: docker/bdapps-simulator/Dockerfile
    image: bdapps-tap-simulator:local
    container_name: bdapps-tap-simulator
    # Native wrapper is linux/x86_64 only — required on Apple Silicon and arm64 Linux hosts.
    platform: linux/amd64
    ports:
      - "10001:10001"
      - "7002:7000"
    environment:
      TAP_REST_PORT: "7000"
      TAP_UI_PORT: "10001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:10001/mchoice-tap-sdk"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
